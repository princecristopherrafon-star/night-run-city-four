<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NIGHT RUN - CITY FOUR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0020;overflow:hidden;font-family:Arial,sans-serif;color:#fff;touch-action:none}
#gameCanvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;filter:saturate(1.7) contrast(1.25) brightness(1.15)}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10;pointer-events:none}
.hudBox{background:rgba(0,0,0,.65);border:2px solid #00ccff;padding:8px 12px;border-radius:12px;font-weight:bold;font-size:13px;box-shadow:0 0 15px #00ccff}
#staminaBar{width:140px;height:12px;background:#333;border-radius:6px;overflow:hidden;margin-top:4px}
#staminaFill{height:100%;width:100%;background:linear-gradient(90deg,#00ff88,#ffff00);transition:width .2s}
#joystick{position:fixed;left:20px;bottom:30px;width:135px;height:135px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.5);border-radius:50%;z-index:20;box-shadow:0 0 20px rgba(0,204,255,.6)}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 15px #fff}
#btns{position:fixed;right:20px;bottom:30px;display:flex;gap:12px;z-index:20}
.btn{width:78px;height:78px;border-radius:50%;border:2px solid #fff;font-weight:900;font-size:13px;color:#fff}
#jumpBtn{background:#ff8800;box-shadow:0 0 15px #ff8800}
#sprintBtn{background:#ff0044;box-shadow:0 0 15px #ff0044}
#menu{position:fixed;inset:0;background:rgba(5,0,30,.95);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
#menu h1{font-size:44px;letter-spacing:3px;color:#00ccff;text-shadow:0 0 25px #00ccff}
#startBtn{padding:16px 42px;font-size:20px;font-weight:900;background:#00ff88;border:none;border-radius:12px;box-shadow:0 0 20px #00ff88}
#wheel{position:relative;width:180px;height:180px;border:3px solid #00ccff;border-radius:50%;margin:10px auto}
#wheel img{position:absolute;width:62px;height:62px;border-radius:50%;border:3px solid #fff;object-fit:cover}
#jumpScare{position:fixed;inset:0;z-index:9999;display:none;background:#000;justify-content:center;align-items:center}
#jumpScare img{width:100%;height:100%;object-fit:cover;filter:contrast(1.8) brightness(1.4) saturate(2)}
#jumpScare h2{position:absolute;font-size:90px;color:red;text-shadow:0 0 30px red}
@keyframes shake{0%{transform:translate(0)}25%{transform:translate(-12px,12px)}50%{transform:translate(12px,-12px)}75%{transform:translate(-12px,-12px)}100%{transform:translate(0)}}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">
<div class="hudBox">THREAT: <span id="threat">--</span>m<br>CITY SECTOR 01<br>TIME: <span id="timer">90</span>s<br><span id="cameraMode">CAMERA: 3RD PERSON</span></div>
<div class="hudBox">STAMINA<div id="staminaBar"><div id="staminaFill"></div></div><div id="speedInfo">SPEED: 0</div></div>
</div>
<div id="joystick"><div id="joyKnob"></div></div>
<div id="btns"><button class="btn" id="jumpBtn">JUMP</button><button class="btn" id="sprintBtn">SPRINT</button></div>
<div id="jumpScare"><img src="63.jpg"><h2>BOO!</h2></div>
<div id="menu">
<h1>NIGHT RUN</h1><p>CITY FOUR - VIBRANT HARDCORE</p>
<p style="color:#ffcc00">⚠ Mas Mabilis! May Jump Scare! Vibrant City!</p>
<div id="wheel"></div>
<div style="display:flex;gap:8px">
<input type="file" id="file0" accept="image/*" style="display:none"><input type="file" id="file1" accept="image/*" style="display:none"><input type="file" id="file2" accept="image/*" style="display:none"><input type="file" id="file3" accept="image/*" style="display:none">
<img id="prev0" style="width:58px;height:58px;border-radius:50%;object-fit:cover" onclick="document.getElementById('file0').click()">
<img id="prev1" style="width:58px;height:58px;border-radius:50%;object-fit:cover" onclick="document.getElementById('file1').click()">
<img id="prev2" style="width:58px;height:58px;border-radius:50%;object-fit:cover" onclick="document.getElementById('file2').click()">
<img id="prev3" style="width:58px;height:58px;border-radius:50%;object-fit:cover" onclick="document.getElementById('file3').click()">
</div>
<button id="startBtn">▶ START RUN</button>
<p style="font-size:12px;opacity:.7">Joystick = Takbo • JUMP = Talon • SPRINT = Hold<br>Takbo papunta sa blue building!</p>
</div>
<audio id="bgMusic" loop></audio><audio id="speedSound"></audio><audio id="heheSound"></audio><audio id="busingSound"></audio>
<script>
// ===== ORIGINAL CODE MO - HINDI SIRA, DAGDAG LANG SA BABA =====
const FILES = [ {name:"BOSENG", img:"boseng.jpg", speed:2.0, color:"#ff4444", desc:"Tough and consistent. Does not tire easily.", maxSpeed:2.2, fatigueRate:0.6}, {name:"MICHAEL", img:"Michael.jpg", speed:2.5, color:"#44ff44", desc:"Balanced. Good speed and stamina.", maxSpeed:2.7, fatigueRate:1.0}, {name:"SPEED", img:"speed.jpg", speed:3.0, color:"#4488ff", desc:"Quick start but tires faster than most.", maxSpeed:3.2, fatigueRate:1.5}, {name:"63", img:"63.jpg", speed:3.6, color:"#ffff00", desc:"Fastest runner but needs frequent rest.", maxSpeed:4.0, fatigueRate:2.5} ];
// DAGDAG LANG - PABILIS X1.9
FILES.forEach(f=>{ f.speed=f.speed*1.9; f.maxSpeed=f.maxSpeed*1.9; });
let loadedImgs = {}; let canvas = document.getElementById('gameCanvas'); let ctx = canvas.getContext('2d'); canvas.width = innerWidth; canvas.height = innerHeight; let isPlaying = false, timeLeft = 90, stamina = 100, isSprinting = false; let cameraMode = '3rd'; let yaw = 0, pitch = 0.35; let playerVelY = 0, onGround = true; let player = {x:0, y:0, z:1.7}; let chasers = [], keys = {}, joyX = 0, joyY = 0; let walls = [], trees = []; let mainBuilding = {x:0, y:-420, w:260, h:260}; let door = {x:-35, y:-300, w:70, h:25}; let platforms = [ {x:0,y:-340,w:65,h:65,z:3.5},{x:55,y:-370,w:55,h:55,z:5.5},{x:-55,y:-400,w:55,h:55,z:7.5}, {x:0,y:-430,w:65,h:65,z:9.5},{x:0,y:-460,w:55,h:55,z:11.5} ]; const bgMusic = document.getElementById('bgMusic'); const speedSound = document.getElementById('speedSound'); const heheSound = document.getElementById('heheSound'); const busingSound = document.getElementById('busingSound');
function preloadImages(callback) { let count = 0; FILES.forEach(f => { const img = new Image(); img.src = f.img; img.onload = img.onerror = () => { count++; if (count >= FILES.length) { buildWheel(); callback && callback(); } }; loadedImgs[f.name] = img; }); }
FILES.forEach((f, i) => { const preview = document.getElementById('prev' + i); if(preview) preview.src = f.img; const inp=document.getElementById('file' + i); if(!inp) return; inp.addEventListener('change', e => { const file = e.target.files[0]; if (!file) return; const url = URL.createObjectURL(file); const newImg = new Image(); newImg.onload = () => { loadedImgs[f.name] = newImg; preview.src = url; buildWheel(); alert(f.name + " - Picture updated"); }; newImg.src = url; }); });
function generateWorld() { walls = []; trees = []; for (let x = -800; x <= 800; x += 200) { for (let y = -800; y <= 800; y += 200) { if (Math.abs(x) < 150 && Math.abs(y) < 150) continue; if (Math.abs(x) < 150 && Math.abs(y + 420) < 200) continue; const shades = ['#FF2D55','#00E5FF','#FFD60A','#7D4DFF','#00FF88','#FF6B00']; walls.push({ x:x, y:y, w:100+Math.random()*40, h:100+Math.random()*40, height:60+Math.random()*120, color:shades[Math.floor(Math.random()*shades.length)] }); } } for (let i = 0; i < 80; i++) { trees.push({x:(Math.random()-.5)*1600, y:(Math.random()-.5)*1600, height:5+Math.random()*5}); } }
function project(x, y, z) { let dx = x - player.x; let dy = y - player.y; let rx = dx * Math.cos(-yaw) - dy * Math.sin(-yaw); let ry = dx * Math.sin(-yaw) + dy * Math.cos(-yaw); let cz = 300 / Math.max(1, ry); return { x: canvas.width/2 + rx * cz, y: canvas.height/2 - (z - player.z + pitch*60) * cz * 0.6, depth: ry, scale: cz/300 }; }
function collide(p, r = 16) { for (let w of walls) { if (p.x+r > w.x-w.w/2 && p.x-r < w.x+w.w/2 && p.y+r > w.y-w.h/2 && p.y-r < w.y+w.h/2) { const dx = p.x - w.x, dy = p.y - w.y; if (Math.abs(dx) > Math.abs(dy)) p.x = w.x + Math.sign(dx) * (w.w/2 + r); else p.y = w.y + Math.sign(dy) * (w.h/2 + r); } } const mb = mainBuilding; if (p.x+r > mb.x-mb.w/2 && p.x-r < mb.x+mb.w/2 && p.y+r > mb.y-mb.h/2 && p.y-r < mb.y+mb.h/2) { const inDoor = p.x > door.x && p.x < door.x+door.w && p.y > door.y-15 && p.y < door.y+35; if (!inDoor) { const dx = p.x - mb.x, dy = p.y - mb.y; if (Math.abs(dx) > Math.abs(dy)) p.x = mb.x + Math.sign(dx) * (mb.w/2 + r); else p.y = mb.y + Math.sign(dy) * (mb.h/2 + r); return 'wall'; } return 'building'; } for (let t of trees) { const dx = p.x - t.x, dy = p.y - t.y, d = Math.hypot(dx, dy); if (d < 28 && d > 0.1) { p.x = t.x + dx/d * 28; p.y = t.y + dy/d * 28; } } p.x = Math.max(-900, Math.min(900, p.x)); p.y = Math.max(-900, Math.min(900, p.y)); return 'open'; }
function makeChaser(f, idx) { const spawns = [[0,800],[800,0],[-800,0],[0,-800],[600,600],[-600,600]]; const sp = spawns[idx % spawns.length]; return {data:f, x:sp[0], y:sp[1], z:1.7, speed:0, tired:0, stamina:100}; }
function playSound(audio) { if (!audio) return; audio.currentTime = 0; audio.volume = 0.4; audio.play().catch(() => {}); }
function startMusic() { bgMusic.volume = 0.25; bgMusic.play().catch(() => {}); }
function toggleCamera() { cameraMode = cameraMode === '3rd' ? '2nd' : '3rd'; document.getElementById('cameraMode').textContent = cameraMode === '3rd' ? 'CAMERA: 3RD PERSON' : 'CAMERA: 1ST PERSON'; }
function buildWheel() { const wheel = document.getElementById('wheel'); if(!wheel) return; wheel.innerHTML = ''; const positions = [ {top:'8px',left:'50%',transform:'translateX(-50%)'}, {top:'50%',right:'8px',transform:'translateY(-50%)'}, {bottom:'8px',left:'50%',transform:'translateX(-50%)'}, {top:'50%',left:'8px',transform:'translateY(-50%)'} ]; FILES.forEach((f, i) => { const img = document.createElement('img'); img.src = loadedImgs[f.name]?.src || f.img; Object.assign(img.style, positions[i]); img.style.borderColor = f.color; wheel.appendChild(img); }); }
function drawSky() { const grad = ctx.createLinearGradient(0,0,0,canvas.height); grad.addColorStop(0,'#0a0020'); grad.addColorStop(0.3,'#4B0082'); grad.addColorStop(0.55,'#FF2D55'); grad.addColorStop(0.75,'#FFD60A'); grad.addColorStop(1,'#00E5FF'); ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height); }
function drawGround() { ctx.fillStyle = '#1a0a2e'; ctx.fillRect(0, canvas.height*0.52, canvas.width, canvas.height*0.5); ctx.strokeStyle = 'rgba(0,229,255,0.25)'; ctx.lineWidth = 2; for (let i = -800; i <= 800; i += 100) { const p1 = project(i, -800, 0); const p2 = project(i, 800, 0); if (p1.depth > 0 && p2.depth > 0) { ctx.beginPath(); ctx.moveTo(p1.x, Math.max(0, p1.y)); ctx.lineTo(p2.x, Math.max(0, p2.y)); ctx.stroke(); } const p3 = project(-800, i, 0); const p4 = project(800, i, 0); if (p3.depth > 0 && p4.depth > 0) { ctx.beginPath(); ctx.moveTo(p3.x, Math.max(0, p3.y)); ctx.lineTo(p4.x, Math.max(0, p4.y)); ctx.stroke(); } } }
function drawBuilding(w) { const base = project(w.x, w.y, 0); if (base.depth <= 0) return; const top = project(w.x, w.y, w.height); const w2 = w.w/2 * base.scale; const h = base.y - top.y; ctx.fillStyle = w.color; ctx.fillRect(base.x - w2, base.y - h, w2*2, h); ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.strokeRect(base.x - w2, base.y - h, w2*2, h); }
function drawMainBuilding() { const mb = mainBuilding; const base = project(mb.x, mb.y, 0); if (base.depth <= 0) return; const top = project(mb.x, mb.y, 35); const w2 = mb.w/2 * base.scale; const h = base.y - top.y; ctx.fillStyle = '#1a2a4a'; ctx.fillRect(base.x - w2, base.y - h, w2*2, h); ctx.strokeStyle = '#00ccff'; ctx.lineWidth = 3; ctx.strokeRect(base.x - w2, base.y - h, w2*2, h); const dp = project(door.x+door.w/2, door.y, 0); if (dp.depth > 0) { ctx.fillStyle = '#00ff88'; ctx.fillRect(dp.x - 15*dp.scale, dp.y - 40*dp.scale, 30*dp.scale, 40*dp.scale); } }
// ===== DAGDAG LANG - JUMP SCARE =====
let lastScare=0, scareCount=0;
function triggerJumpScare(){ let el=document.getElementById('jumpScare'); el.style.display='flex'; document.body.style.animation='shake 0.4s'; if(heheSound) playSound(heheSound); setTimeout(()=>{ el.style.display='none'; document.body.style.animation=''; },650); }
function checkJumpScare(){ let now=Date.now(); if(now-lastScare<7000) return; for(let c of chasers){ let d=Math.hypot(c.x-player.x,c.y-player.y); if(d<160&&Math.random()<0.04){ lastScare=now; scareCount++; triggerJumpScare(); break; } } if(Math.random()<0.0012&&now-lastScare>12000){ lastScare=now; triggerJumpScare(); } }
// ===== DAGDAG LANG - JOYSTICK (AYOS NA, HINDI BALIKTAD) =====
let joy=document.getElementById('joystick'), knob=document.getElementById('joyKnob');
function joyMove(e){ let r=joy.getBoundingClientRect(); let t=e.touches?e.touches[0]:e; let dx=(t.clientX-(r.left+r.width/2))/60; let dy=(t.clientY-(r.top+r.height/2))/60; let l=Math.hypot(dx,dy); if(l>1){dx/=l;dy/=l;} joyX=dx; joyY=dy; knob.style.left=(50+dx*35)+'%'; knob.style.top=(50+dy*35)+'%'; }
joy.addEventListener('touchstart',e=>{ joyMove(e); e.preventDefault(); });
joy.addEventListener('touchmove',e=>{ joyMove(e); e.preventDefault(); });
joy.addEventListener('touchend',()=>{ joyX=0; joyY=0; knob.style.left='50%'; knob.style.top='50%'; });
document.getElementById('jumpBtn').addEventListener('touchstart',e=>{ if(onGround){ playerVelY=9; onGround=false; } e.preventDefault(); });
document.getElementById('sprintBtn').addEventListener('touchstart',e=>{ isSprinting=true; e.preventDefault(); });
document.getElementById('sprintBtn').addEventListener('touchend',()=>isSprinting=false);
document.getElementById('startBtn').addEventListener('click',()=>{ document.getElementById('menu').style.display='none'; isPlaying=true; generateWorld(); chasers=FILES.map((f,i)=>makeChaser(f,i)); preloadImages(()=>{}); loop(); setInterval(()=>{ if(!isPlaying) return; timeLeft--; document.getElementById('timer').textContent=timeLeft; if(timeLeft<=0){ alert('YOU SURVIVED! Jump Scares: '+scareCount); location.reload(); } },1000); });
function loop(){ if(!isPlaying) return; requestAnimationFrame(loop);
// PLAYER - MAS MABILIS + JOYSTICK FIX: -joyY ang forward, joyX ang right
let baseSpeed=isSprinting?11.5:7.8;
if(isSprinting){ stamina=Math.max(0,stamina-0.8); if(stamina<=0) isSprinting=false; } else stamina=Math.min(100,stamina+0.35);
document.getElementById('staminaFill').style.width=stamina+'%';
let moveX=(Math.sin(yaw)*-joyY + Math.cos(yaw)*joyX)*baseSpeed;
let moveY=(Math.cos(yaw)*-joyY - Math.sin(yaw)*joyX)*baseSpeed;
player.x+=moveX; player.y+=moveY;
if(!onGround){ player.z+=playerVelY*0.3; playerVelY-=0.6; if(player.z<=1.7){ player.z=1.7; onGround=true; playerVelY=0; } }
collide(player);
let nearest=9999;
for(let c of chasers){ let dx=player.x-c.x, dy=player.y-c.y, d=Math.hypot(dx,dy); nearest=Math.min(nearest,d); let cs=c.data.maxSpeed*1.15; if(d<220) cs*=1.35; if(d>1){ c.x+=dx/d*cs; c.y+=dy/d*cs; } collide(c); if(d<24){ alert('NAHULI KA! Jump Scares: '+scareCount); location.reload(); return; } }
document.getElementById('threat').textContent=Math.floor(nearest);
document.getElementById('speedInfo').textContent='SPEED: '+Math.floor(Math.hypot(moveX,moveY)*10);
checkJumpScare();
drawSky(); drawGround();
for(let w of walls) drawBuilding(w);
drawMainBuilding();
for(let p of platforms){ let b=project(p.x,p.y,p.z); if(b.depth<=0) continue; ctx.fillStyle='#FFD60A'; ctx.fillRect(b.x-25*b.scale,b.y-5,50*b.scale,10); }
for(let c of chasers){ let p=project(c.x,c.y,0); if(p.depth<=0) continue; let img=loadedImgs[c.data.name]; if(img&&img.complete&&img.naturalWidth>0){ ctx.drawImage(img,p.x-25*p.scale,p.y-70*p.scale,50*p.scale,50*p.scale); } else { ctx.fillStyle=c.data.color; ctx.beginPath(); ctx.arc(p.x,p.y-40*p.scale,22*p.scale,0,Math.PI*2); ctx.fill(); } ctx.fillStyle='#fff'; ctx.font='bold 14px Arial'; ctx.fillText(c.data.name,p.x-20,p.y-80*p.scale); }
ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(canvas.width/2,canvas.height-90,18,0,Math.PI*2); ctx.fill();
}
preloadImages(()=>{});
</script>
</body>
</html>
