
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080018">
<title>NIGHT RUN - CITY FOUR</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080018;
  font-family: Arial, sans-serif;
  color: white;
  touch-action: none;
  user-select: none;
}

#gameCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#hud {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  z-index: 10;
  pointer-events: none;
}

.hudBox {
  background: rgba(0,0,0,.72);
  border: 1px solid #00ccff;
  padding: 8px 12px;
  border-radius: 12px;
  font-weight: bold;
  font-size: 12px;
  box-shadow: 0 0 15px #00ccff77;
  backdrop-filter: blur(8px);
}

#staminaBar {
  width: 125px;
  height: 10px;
  background: #333;
  border-radius: 8px;
  overflow: hidden;
  margin-top: 5px;
}

#staminaFill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg,#00ff88,#ffff00);
  transition: width .12s;
}

#speedInfo {
  margin-top: 5px;
  font-size: 11px;
}

#joystick {
  position: fixed;
  left: 20px;
  bottom: 22px;
  width: 130px;
  height: 130px;
  background: rgba(255,255,255,.12);
  border: 2px solid rgba(255,255,255,.55);
  border-radius: 50%;
  z-index: 20;
  box-shadow: 0 0 22px rgba(0,204,255,.55);
  touch-action: none;
  backdrop-filter: blur(5px);
}

#joyKnob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 56px;
  height: 56px;
  background: radial-gradient(circle at 30% 25%,#fff,#b5c7dc 70%,#526b80);
  border-radius: 50%;
  transform: translate(-50%,-50%);
  box-shadow: 0 0 18px #fff;
}

#btns {
  position: fixed;
  right: 20px;
  bottom: 22px;
  display: flex;
  gap: 12px;
  z-index: 20;
}

.btn {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: 2px solid white;
  font-weight: 900;
  font-size: 12px;
  color: white;
  touch-action: none;
}

#jumpBtn {
  background: #ff8800;
  box-shadow: 0 0 18px #ff8800;
}

#sprintBtn {
  background: #ff0044;
  box-shadow: 0 0 18px #ff0044;
}

#cameraBtn {
  position: fixed;
  right: 15px;
  top: 100px;
  z-index: 20;
  padding: 9px 12px;
  border: 1px solid #00ccff;
  border-radius: 9px;
  color: white;
  background: rgba(0,10,30,.85);
  font-weight: bold;
}

#menu {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center,#190044,#050014 80%);
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  padding: 15px;
  overflow-y: auto;
}

#menu h1 {
  font-size: clamp(34px,8vw,48px);
  letter-spacing: 3px;
  color: #00ccff;
  text-shadow: 0 0 25px #00ccff;
}

#startBtn {
  padding: 15px 42px;
  font-size: 19px;
  font-weight: 900;
  background: #00ff88;
  border: none;
  border-radius: 12px;
  box-shadow: 0 0 20px #00ff88;
  color: #001b13;
}

#wheel {
  position: relative;
  width: 155px;
  height: 155px;
  border: 3px solid #00ccff;
  border-radius: 50%;
  margin: 5px auto;
  box-shadow: 0 0 20px #00ccff66;
}

#wheel img {
  position: absolute;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 3px solid white;
  object-fit: cover;
  background: #111;
}

#previews {
  display: flex;
  gap: 8px;
}

#previews img {
  width: 53px;
  height: 53px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #00ccff;
  background: #111;
}

#jumpScare {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  justify-content: center;
  align-items: center;
  background: #000;
  overflow: hidden;
}

#scareImage {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: contrast(1.4) brightness(1.15) saturate(1.5);
}

#scareText {
  position: absolute;
  bottom: 12%;
  left: 0;
  right: 0;
  text-align: center;
  font-size: clamp(30px,8vw,75px);
  font-weight: 1000;
  color: #ff001e;
  text-shadow: 0 0 12px red,0 0 35px red;
  pointer-events: none;
}

#scareSub {
  position: absolute;
  top: 8%;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 15px;
  letter-spacing: 5px;
  color: white;
  text-shadow: 0 0 12px red;
}

#scareRestart {
  position: absolute;
  bottom: 3%;
  padding: 13px 28px;
  border: none;
  border-radius: 10px;
  background: #ff1744;
  color: white;
  font-weight: bold;
  font-size: 15px;
  display: none;
}

#dangerVignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
  background: radial-gradient(transparent 40%,rgba(255,0,30,.55));
  transition: opacity .15s;
}

@keyframes shake {
  0% { transform: translate(0,0) scale(1.03); }
  15% { transform: translate(-15px,12px) scale(1.03); }
  30% { transform: translate(15px,-12px) scale(1.03); }
  45% { transform: translate(-12px,-12px) scale(1.03); }
  60% { transform: translate(12px,12px) scale(1.03); }
  75% { transform: translate(-8px,5px) scale(1.03); }
  100% { transform: translate(0,0) scale(1); }
}

.shaking {
  animation: shake .4s;
}

@media (orientation:landscape) {
  #joystick {
    width: 112px;
    height: 112px;
    left: 18px;
    bottom: 14px;
  }

  #joyKnob {
    width: 49px;
    height: 49px;
  }

  #btns {
    right: 18px;
    bottom: 14px;
  }

  .btn {
    width: 68px;
    height: 68px;
  }

  #hud {
    top: 7px;
  }

  #cameraBtn {
    top: 82px;
  }

  #wheel {
    width: 120px;
    height: 120px;
  }

  #wheel img {
    width: 43px;
    height: 43px;
  }

  #menu {
    gap: 5px;
  }

  #previews img {
    width: 42px;
    height: 42px;
  }
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>
<div id="dangerVignette"></div>

<div id="hud">
  <div class="hudBox">
    THREAT: <span id="threat">--</span>m<br>
    CITY SECTOR 01<br>
    TIME: <span id="timer">90</span>s<br>
    <span id="cameraMode">CAMERA: 3RD PERSON</span>
  </div>

  <div class="hudBox">
    STAMINA
    <div id="staminaBar">
      <div id="staminaFill"></div>
    </div>
    <div id="speedInfo">SPEED: 0</div>
  </div>
</div>

<button id="cameraBtn">CAMERA</button>

<div id="joystick">
  <div id="joyKnob"></div>
</div>

<div id="btns">
  <button class="btn" id="jumpBtn">JUMP</button>
  <button class="btn" id="sprintBtn">SPRINT</button>
</div>

<div id="jumpScare">
  <img id="scareImage" src="63.jpg" alt="Hunter">
  <div id="scareSub">YOU HAVE BEEN CAUGHT BY</div>
  <div id="scareText">BOOOOO!</div>
  <button id="scareRestart">TRY AGAIN</button>
</div>

<div id="menu">
  <h1>NIGHT RUN</h1>
  <p>CITY FOUR - VIBRANT HARDCORE</p>
  <p style="color:#ffcc00;font-size:12px">
    ⚠ FAST HUNTERS • FULL SCREEN JUMPSCARE
  </p>

  <div id="wheel"></div>

  <div style="display:flex;gap:8px">
    <input type="file" id="file0" accept="image/*" hidden>
    <input type="file" id="file1" accept="image/*" hidden>
    <input type="file" id="file2" accept="image/*" hidden>
    <input type="file" id="file3" accept="image/*" hidden>

    <img id="prev0" alt="BOSENG">
    <img id="prev1" alt="MICHAEL">
    <img id="prev2" alt="SPEED">
    <img id="prev3" alt="63">
  </div>

  <button id="startBtn">▶ START RUN</button>

  <p style="font-size:11px;opacity:.7;line-height:1.6">
    Joystick = Move • JUMP = Jump • SPRINT = Hold<br>
    Reach the blue building and survive!
  </p>
</div>

<audio id="bgMusic" loop></audio>
<audio id="speedSound"></audio>
<audio id="heheSound"></audio>
<audio id="busingSound"></audio>

<script>
"use strict";

// ========================================
// NIGHT RUN - CITY FOUR
// ORIGINAL GAME ENGINE + IMPROVEMENTS
// ========================================

const FILES = [
  {
    name:"BOSENG",
    img:"boseng.jpg",
    speed:2.0,
    color:"#ff4444",
    desc:"Tough and consistent. Does not tire easily.",
    maxSpeed:2.2,
    fatigueRate:0.6
  },
  {
    name:"MICHAEL",
    img:"Michael.jpg",
    speed:2.5,
    color:"#44ff44",
    desc:"Balanced. Good speed and stamina.",
    maxSpeed:2.7,
    fatigueRate:1.0
  },
  {
    name:"SPEED",
    img:"speed.jpg",
    speed:3.0,
    color:"#4488ff",
    desc:"Quick start but tires faster than most.",
    maxSpeed:3.2,
    fatigueRate:1.5
  },
  {
    name:"63",
    img:"63.jpg",
    speed:3.6,
    color:"#ffff00",
    desc:"Fastest runner but needs frequent rest.",
    maxSpeed:4.0,
    fatigueRate:2.5
  }
];

// Original speed multiplier
FILES.forEach(f => {
  f.speed *= 1.9;
  f.maxSpeed *= 1.9;
});

// ========================================
// GAME VARIABLES
// ========================================

let loadedImgs = {};

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

let isPlaying = false;
let gameEnded = false;

let timeLeft = 90;
let stamina = 100;
let isSprinting = false;

let cameraMode = "3rd";

let yaw = 0;
let pitch = 0.35;

let playerVelY = 0;
let onGround = true;

let player = {
  x:0,
  y:0,
  z:1.7
};

let chasers = [];
let keys = {};

let joyX = 0;
let joyY = 0;

let walls = [];
let trees = [];

let mainBuilding = {
  x:0,
  y:-420,
  w:260,
  h:260
};

let door = {
  x:-35,
  y:-300,
  w:70,
  h:25
};

let platforms = [
  {x:0,y:-340,w:65,h:65,z:3.5},
  {x:55,y:-370,w:55,h:55,z:5.5},
  {x:-55,y:-400,w:55,h:55,z:7.5},
  {x:0,y:-430,w:65,h:65,z:9.5},
  {x:0,y:-460,w:55,h:55,z:11.5}
];

const bgMusic = document.getElementById("bgMusic");
const speedSound = document.getElementById("speedSound");
const heheSound = document.getElementById("heheSound");
const busingSound = document.getElementById("busingSound");

let lastTime = 0;
let elapsed = 0;
let timerAccumulator = 0;

let scareCount = 0;
let audioContext = null;

// ========================================
// CANVAS RESIZE
// ========================================

function resizeCanvas() {
  W = innerWidth;
  H = innerHeight;

  canvas.width = W;
  canvas.height = H;
}

resizeCanvas();

addEventListener("resize", resizeCanvas);

addEventListener("orientationchange", () => {
  setTimeout(resizeCanvas, 250);
});

// ========================================
// IMAGE LOADING
// ========================================

function preloadImages(callback) {
  let count = 0;

  FILES.forEach(f => {
    const img = new Image();

    img.onload = finish;
    img.onerror = finish;

    function finish() {
      count++;

      if (count >= FILES.length) {
        buildWheel();

        if (callback) callback();
      }
    }

    img.src = f.img;
    loadedImgs[f.name] = img;
  });
}

// Custom character pictures
FILES.forEach((f,i) => {
  const preview = document.getElementById("prev"+i);
  const input = document.getElementById("file"+i);

  preview.src = f.img;

  input.addEventListener("change", e => {
    const file = e.target.files[0];

    if (!file) return;

    const url = URL.createObjectURL(file);
    const newImg = new Image();

    newImg.onload = () => {
      loadedImgs[f.name] = newImg;
      preview.src = url;
      buildWheel();
    };

    newImg.src = url;
  });
});

// ========================================
// CHARACTER WHEEL
// ========================================

function buildWheel() {
  const wheel = document.getElementById("wheel");

  wheel.innerHTML = "";

  const positions = [
    {
      top:"5px",
      left:"50%",
      transform:"translateX(-50%)"
    },
    {
      top:"50%",
      right:"5px",
      transform:"translateY(-50%)"
    },
    {
      bottom:"5px",
      left:"50%",
      transform:"translateX(-50%)"
    },
    {
      top:"50%",
      left:"5px",
      transform:"translateY(-50%)"
    }
  ];

  FILES.forEach((f,i) => {
    const img = document.createElement("img");

    img.src = loadedImgs[f.name]?.src || f.img;

    Object.assign(img.style,positions[i]);

    img.style.borderColor = f.color;

    wheel.appendChild(img);
  });
}

// ========================================
// WORLD GENERATION
// ========================================

function generateWorld() {
  walls = [];
  trees = [];

  const shades = [
    "#FF2D55",
    "#00E5FF",
    "#FFD60A",
    "#7D4DFF",
    "#00FF88",
    "#FF6B00"
  ];

  for (let x=-800;x<=800;x+=200) {
    for (let y=-800;y<=800;y+=200) {

      if (Math.abs(x)<150 && Math.abs(y)<150) continue;

      if (Math.abs(x)<150 && Math.abs(y+420)<200) continue;

      walls.push({
        x:x,
        y:y,
        w:100+Math.random()*40,
        h:100+Math.random()*40,
        height:60+Math.random()*120,
        color:shades[Math.floor(Math.random()*shades.length)]
      });
    }
  }

  for (let i=0;i<80;i++) {
    trees.push({
      x:(Math.random()-.5)*1600,
      y:(Math.random()-.5)*1600,
      height:5+Math.random()*5
    });
  }
}

// ========================================
// CAMERA PROJECTION
// ========================================

function project(x,y,z) {
  const dx = x-player.x;
  const dy = y-player.y;

  const rx =
    dx*Math.cos(-yaw) -
    dy*Math.sin(-yaw);

  const ry =
    dx*Math.sin(-yaw) +
    dy*Math.cos(-yaw);

  const cz = 300/Math.max(1,ry);

  return {
    x:W/2+rx*cz,
    y:H/2-(z-player.z+pitch*60)*cz*.6,
    depth:ry,
    scale:cz/300
  };
}

// ========================================
// COLLISION
// ========================================

function collide(p,r=16) {

  for (const w of walls) {

    if (
      p.x+r>w.x-w.w/2 &&
      p.x-r<w.x+w.w/2 &&
      p.y+r>w.y-w.h/2 &&
      p.y-r<w.y+w.h/2
    ) {
      const dx = p.x-w.x;
      const dy = p.y-w.y;

      if (Math.abs(dx)>Math.abs(dy)) {
        p.x = w.x+Math.sign(dx)*(w.w/2+r);
      } else {
        p.y = w.y+Math.sign(dy)*(w.h/2+r);
      }
    }
  }

  const mb = mainBuilding;

  if (
    p.x+r>mb.x-mb.w/2 &&
    p.x-r<mb.x+mb.w/2 &&
    p.y+r>mb.y-mb.h/2 &&
    p.y-r<mb.y+mb.h/2
  ) {

    const inDoor =
      p.x>door.x &&
      p.x<door.x+door.w &&
      p.y>door.y-15 &&
      p.y<door.y+35;

    if (!inDoor) {
      const dx = p.x-mb.x;
      const dy = p.y-mb.y;

      if (Math.abs(dx)>Math.abs(dy)) {
        p.x = mb.x+Math.sign(dx)*(mb.w/2+r);
      } else {
        p.y = mb.y+Math.sign(dy)*(mb.h/2+r);
      }

      return "wall";
    }

    return "building";
  }

  for (const t of trees) {
    const dx = p.x-t.x;
    const dy = p.y-t.y;
    const d = Math.hypot(dx,dy);

    if (d<28 && d>0.1) {
      p.x = t.x+dx/d*28;
      p.y = t.y+dy/d*28;
    }
  }

  p.x = Math.max(-900,Math.min(900,p.x));
  p.y = Math.max(-900,Math.min(900,p.y));

  return "open";
}

// ========================================
// HUNTERS
// ========================================

function makeChaser(f,idx) {
  const spawns = [
    [0,800],
    [800,0],
    [-800,0],
    [0,-800],
    [600,600],
    [-600,600]
  ];

  const sp = spawns[idx%spawns.length];

  return {
    data:f,
    x:sp[0],
    y:sp[1],
    z:1.7,
    speed:0,
    tired:0,
    stamina:100
  };
}

// ========================================
// AUDIO
// ========================================

function initAudio() {
  try {
    if (!audioContext) {
      audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
    }

    if (audioContext.state==="suspended") {
      audioContext.resume();
    }
  } catch(e) {}
}

function playSound(audio) {
  if (!audio || !audio.src) return;

  audio.currentTime = 0;
  audio.volume = 0.4;

  audio.play().catch(()=>{});
}

function startMusic() {
  bgMusic.volume = 0.25;
  bgMusic.play().catch(()=>{});
}

function playScareSound() {
  if (!audioContext) return;

  try {
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
      750,
      audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
      65,
      audioContext.currentTime+.55
    );

    gain.gain.setValueAtTime(
      .25,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime+.65
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();
    osc.stop(audioContext.currentTime+.65);

  } catch(e) {}
}

// ========================================
// CAMERA MODE
// ========================================

function toggleCamera() {
  cameraMode = cameraMode==="3rd" ? "1st" : "3rd";

  document.getElementById("cameraMode").textContent =
    cameraMode==="3rd"
      ? "CAMERA: 3RD PERSON"
      : "CAMERA: 1ST PERSON";
}

document.getElementById("cameraBtn").addEventListener(
  "click",
  toggleCamera
);

// ========================================
// DRAWING HELPERS
// ========================================

function drawSky() {
  const grad = ctx.createLinearGradient(0,0,0,H);

  grad.addColorStop(0,"#080018");
  grad.addColorStop(.30,"#24105a");
  grad.addColorStop(.55,"#6b176d");
  grad.addColorStop(.75,"#e43b69");
  grad.addColorStop(1,"#190d37");

  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Stars
  for (let i=0;i<65;i++) {
    const x=(i*173)%W;
    const y=(i*83)%(H*.48);

    ctx.globalAlpha=.35+Math.sin(elapsed*.002+i)*.25;

    ctx.fillStyle=i%2 ? "#00d9ff" : "#ff39c9";

    ctx.fillRect(x,y,2,2);
  }

  ctx.globalAlpha=1;

  // Horizon glow
  const glow = ctx.createRadialGradient(
    W/2,H*.53,10,
    W/2,H*.53,W*.65
  );

  glow.addColorStop(0,"rgba(255,0,180,.20)");
  glow.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);
}

function drawGround() {
  const ground = ctx.createLinearGradient(
    0,H*.45,
    0,H
  );

  ground.addColorStop(0,"#1b0b39");
  ground.addColorStop(1,"#050713");

  ctx.fillStyle=ground;
  ctx.fillRect(0,H*.45,W,H*.55);

  ctx.strokeStyle="rgba(0,229,255,.22)";
  ctx.lineWidth=1;

  // Perspective grid
  for (let i=-800;i<=800;i+=100) {
    const p1=project(i,-800,0);
    const p2=project(i,800,0);

    if (p1.depth>0 && p2.depth>0) {
      ctx.beginPath();
      ctx.moveTo(p1.x,p1.y);
      ctx.lineTo(p2.x,p2.y);
      ctx.stroke();
    }

    const p3=project(-800,i,0);
    const p4=project(800,i,0);

    if (p3.depth>0 && p4.depth>0) {
      ctx.beginPath();
      ctx.moveTo(p3.x,p3.y);
      ctx.lineTo(p4.x,p4.y);
      ctx.stroke();
    }
  }
}

function drawBuilding(w) {
  const base=project(w.x,w.y,0);

  if (base.depth<=0) return;

  const top=project(w.x,w.y,w.height);

  const w2=w.w/2*base.scale;
  const h=base.y-top.y;

  if (w2<.5 || h<.5) return;

  ctx.fillStyle=w.color;
  ctx.globalAlpha=.88;
  ctx.fillRect(base.x-w2,base.y-h,w2*2,h);
  ctx.globalAlpha=1;

  ctx.strokeStyle="rgba(255,255,255,.65)";
  ctx.lineWidth=Math.max(1,2*base.scale);

  ctx.strokeRect(
    base.x-w2,
